services:
  - type: web
    name: mystical-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://mystical-scheduling-2026.web.app,https://mystical-scheduling-2026.firebaseapp.com,http://localhost:3001
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_MANAGER
        generateValue: true
      - key: API_KEY_AGENT
        generateValue: true
      - key: API_KEY_ASSISTANT
        generateValue: true
      - key: API_KEY_SYSTEM
        generateValue: true
      - key: ENABLE_PRIVACY_ENGINE
        value: "true"
      - key: ENABLE_AUDIT
        value: "true"
      - key: ENABLE_WAITLIST
        value: "true"
      - key: ENABLE_PAYMENTS
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://mystical-backend-eaf6.onrender.com/api/payments/success
      - key: STRIPE_CANCEL_URL
        value: https://mystical-backend-eaf6.onrender.com/api/payments/cancel
      - key: MOCK_PAYMENTS
        value: "false"
      - key: CANCELLATION_WINDOW_HOURS
        value: "24"
